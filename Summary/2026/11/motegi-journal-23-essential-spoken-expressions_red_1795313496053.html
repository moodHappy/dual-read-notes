<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="referrer" content="no-referrer" />
  <title>MOTEGI JOURNAL — 23 Essential Spoken Expressions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F5F0E1;
      --surface: #FAF7EE;
      --surface-tint: #E5EBDD;
      --ink: #1C1E1B;
      --ink-secondary: #535850;
      --ink-muted: #848980;
      --accent: #2C4A3B;
      --accent-soft: rgba(44, 74, 59, 0.11);
      --rust: #9A4D36;
      --rule: rgba(28, 30, 27, 0.14);
      --rule-strong: rgba(28, 30, 27, 0.72);
      --mark-bg: #E5EBDD;
      --mark-ink: #1E3A2C;
      --shadow: 0 1px 2px rgba(28, 30, 27, 0.04);
      --font-serif: "Cormorant Garamond", "Georgia", "Songti SC", "Noto Serif SC", serif;
      --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --base-size: 16px;
    }

    [data-theme="dark"] {
      --bg: #161816;
      --surface: #1D201D;
      --surface-tint: #252B25;
      --ink: #E8E3D5;
      --ink-secondary: #A9AEA5;
      --ink-muted: #767B73;
      --accent: #8FB39C;
      --accent-soft: rgba(143, 179, 156, 0.14);
      --rust: #D4886E;
      --rule: rgba(232, 227, 213, 0.13);
      --rule-strong: rgba(232, 227, 213, 0.65);
      --mark-bg: rgba(143, 179, 156, 0.18);
      --mark-ink: #C5DFCE;
      --shadow: none;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
      font-size: var(--base-size);
      background: var(--bg);
    }

    body {
      background-color: var(--bg);
      color: var(--ink);
      font-family: var(--font-sans);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      transition: background-color 0.28s ease, color 0.28s ease;
      padding-bottom: env(safe-area-inset-bottom, 24px);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.028;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .page {
      position: relative;
      z-index: 1;
      max-width: 820px;
      margin: 0 auto;
      padding: 0 24px 72px;
    }

    /* Masthead */
    .masthead {
      padding-top: 28px;
      padding-bottom: 24px;
      border-bottom: 3px double var(--rule-strong);
    }

    .cover-header {
      padding: 12px 0 8px;
      text-align: center;
    }

    .kicker {
      display: inline-block;
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 12px;
    }

    .cover-title {
      font-family: var(--font-serif);
      font-size: clamp(2.5rem, 7.5vw, 4.4rem);
      font-weight: 600;
      line-height: 0.98;
      letter-spacing: -0.02em;
      color: var(--ink);
      margin-bottom: 14px;
    }

    .cover-title em {
      font-style: italic;
      font-weight: 500;
      color: var(--accent);
    }

    .cover-deck {
      max-width: 560px;
      margin: 0 auto;
      font-size: 0.94rem;
      color: var(--ink-secondary);
      line-height: 1.7;
    }

    .editorial-stats {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--rule);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      text-align: center;
      gap: 8px;
    }

    .stat-num {
      font-family: var(--font-serif);
      font-size: 1.55rem;
      font-weight: 600;
      line-height: 1.1;
      color: var(--ink);
    }

    .stat-label {
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-top: 3px;
    }

    /* Sticky Utility Navigation */
    .sticky-bar {
      position: sticky;
      top: 0;
      z-index: 30;
      margin: 0 -24px 28px;
      padding: 10px 24px;
      background: color-mix(in srgb, var(--bg) 90%, transparent);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--rule);
    }

    .toolbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .chapter-nav {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding: 2px 0;
    }

    .chapter-nav::-webkit-scrollbar {
      display: none;
    }

    .nav-pill {
      flex: 0 0 auto;
      text-decoration: none;
      font-size: 0.74rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--ink-secondary);
      padding: 5px 11px;
      border-radius: 999px;
      border: 1px solid var(--rule);
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .nav-pill:hover,
    .nav-pill.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #FAF7EE;
    }

    [data-theme="dark"] .nav-pill:hover,
    [data-theme="dark"] .nav-pill.active {
      color: #161816;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .ctrl-btn {
      appearance: none;
      border: 1px solid var(--rule);
      background: var(--surface);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 0.74rem;
      font-weight: 500;
      height: 30px;
      padding: 0 10px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .ctrl-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .ctrl-btn.is-active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Section Headers */
    .chapter {
      margin-top: 42px;
      scroll-margin-top: 66px;
    }

    .chapter:first-of-type {
      margin-top: 8px;
    }

    .chapter-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 12px;
      margin-bottom: 8px;
      border-bottom: 2px solid var(--rule-strong);
    }

    .chapter-title-wrap {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .chapter-roman {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 1.45rem;
      font-weight: 600;
      color: var(--rust);
    }

    .chapter-title {
      font-family: var(--font-serif);
      font-size: 1.55rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--ink);
    }

    .chapter-cn {
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      color: var(--ink-muted);
      white-space: nowrap;
    }

    /* Editorial Entry */
    .entry {
      padding: 26px 0 28px;
      border-bottom: 1px solid var(--rule);
    }

    .entry:last-child {
      border-bottom: none;
    }

    .entry-top {
      display: grid;
      grid-template-columns: 54px 1fr;
      gap: 14px;
      align-items: start;
      margin-bottom: 18px;
    }

    .entry-index {
      font-family: var(--font-serif);
      font-size: 2.35rem;
      font-weight: 500;
      line-height: 0.88;
      color: var(--ink-muted);
      opacity: 0.58;
      letter-spacing: -0.03em;
      user-select: none;
    }

    .entry-heading {
      min-width: 0;
    }

    .phrase-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }

    .phrase-en {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 4.2vw, 1.9rem);
      font-weight: 700;
      line-height: 1.18;
      color: var(--ink);
      letter-spacing: -0.01em;
      word-break: break-word;
    }

    .phrase-speak,
    .line-speak {
      position: relative;
      flex-shrink: 0;
      border: none;
      background: transparent;
      color: var(--ink-muted);
      border-radius: 50%;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .phrase-speak {
      width: 34px;
      height: 34px;
    }

    .line-speak {
      margin-top: 2px;
      width: 30px;
      height: 30px;
    }

    .phrase-speak:hover,
    .line-speak:hover,
    .phrase-speak.speaking,
    .line-speak.speaking,
    .phrase-speak.loading,
    .line-speak.loading {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .phrase-speak.loading::after,
    .line-speak.loading::after {
      content: "";
      position: absolute;
      inset: 2px;
      border-radius: 50%;
      border: 1.6px solid transparent;
      border-top-color: var(--accent);
      animation: ttsSpin 0.8s linear infinite;
    }

    @keyframes ttsSpin {
      to { transform: rotate(360deg); }
    }

    .phrase-speak.speaking,
    .line-speak.speaking {
      animation: speakPulse 1.3s ease-in-out infinite;
    }

    @keyframes speakPulse {
      0%, 100% {
        box-shadow: 0 0 0 0 var(--accent-soft);
      }
      50% {
        box-shadow: 0 0 0 5px transparent;
      }
    }

    .phrase-cn {
      margin-top: 6px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.88rem;
      color: var(--accent);
      font-weight: 500;
    }

    .phrase-cn::before {
      content: "";
      display: inline-block;
      width: 14px;
      height: 1px;
      background: var(--rust);
    }

    /* Examples Column */
    .examples {
      margin-left: 68px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .example-card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--rule);
      border-left: 2.5px solid var(--accent);
      border-radius: 2px 8px 8px 2px;
      padding: 13px 16px;
      box-shadow: var(--shadow);
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .example-card:hover {
      border-left-color: var(--rust);
    }

    .example-en-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .example-en {
      font-size: 0.98rem;
      line-height: 1.62;
      color: var(--ink);
      font-weight: 400;
    }

    .example-en mark {
      background: var(--mark-bg);
      color: var(--mark-ink);
      font-weight: 600;
      padding: 1px 5px;
      border-radius: 3px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }

    .example-cn {
      margin-top: 6px;
      font-size: 0.86rem;
      line-height: 1.55;
      color: var(--ink-secondary);
      transition: filter 0.22s ease, opacity 0.22s ease;
    }

    /* Hide Chinese Mode (Tap to reveal) */
    body.hide-cn .example-cn {
      filter: blur(5px);
      opacity: 0.32;
      user-select: none;
      cursor: pointer;
    }

    body.hide-cn .example-cn.revealed {
      filter: none;
      opacity: 1;
      user-select: text;
    }

    /* Colophon Footer */
    .colophon {
      margin-top: 56px;
      padding-top: 22px;
      border-top: 3px double var(--rule-strong);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 0.74rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }

    .colophon-brand {
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .colophon strong {
      font-family: var(--font-serif);
      font-size: 0.98rem;
      font-style: italic;
      text-transform: none;
      letter-spacing: 0.02em;
      color: var(--ink-secondary);
      font-weight: 600;
    }

    .colophon-link {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
      padding-bottom: 1px;
      font-weight: 500;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .colophon-link:hover {
      color: var(--rust);
      border-color: var(--rust);
    }

    /* Subtle non-intrusive status toast */
    .tts-toast {
      position: fixed;
      left: 50%;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%) translateY(12px);
      z-index: 60;
      background: var(--ink);
      color: var(--bg);
      font-size: 0.76rem;
      letter-spacing: 0.03em;
      padding: 7px 14px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
      max-width: calc(100vw - 32px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tts-toast.show {
      opacity: 0.92;
      transform: translateX(-50%) translateY(0);
    }

    /* Mobile Optimization */
    @media (max-width: 640px) {
      .page {
        padding: 0 16px 56px;
      }

      .masthead {
        padding-top: 20px;
        padding-bottom: 18px;
      }

      .cover-header {
        padding: 8px 0 6px;
      }

      .cover-deck {
        font-size: 0.88rem;
      }

      .sticky-bar {
        margin: 0 -16px 20px;
        padding: 9px 16px;
      }

      .toolbar-inner {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
      }

      .controls {
        justify-content: flex-end;
      }

      .chapter {
        margin-top: 34px;
        scroll-margin-top: 96px;
      }

      .chapter-head {
        flex-direction: column;
        gap: 3px;
        padding-bottom: 10px;
      }

      .chapter-title {
        font-size: 1.38rem;
      }

      .entry {
        padding: 22px 0 24px;
      }

      .entry-top {
        grid-template-columns: 38px 1fr;
        gap: 10px;
        margin-bottom: 14px;
      }

      .entry-index {
        font-size: 1.85rem;
      }

      .examples {
        margin-left: 0;
        gap: 10px;
      }

      .example-card {
        padding: 12px 13px;
      }

      .example-en {
        font-size: 0.96rem;
      }

      .example-cn {
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <div class="cover-header">
        <span class="kicker">Curated MotoGP Vlog Lexicon</span>
        <h1 class="cover-title">Trackside <em>Idioms</em><br />at Motegi</h1>
        <p class="cover-deck">
          精选日本 MotoGP 茂木站 Vlog 中最鲜活、地道的 23 组英语口语表达。从凌晨赴赛、机车圈俚语到围场机械闲聊与夺冠欢呼，每一条均配有三句日常例句。
        </p>

        <div class="editorial-stats">
          <div>
            <div class="stat-num">23</div>
            <div class="stat-label">Expressions</div>
          </div>
          <div>
            <div class="stat-num">69</div>
            <div class="stat-label">Spoken Lines</div>
          </div>
          <div>
            <div class="stat-num">04</div>
            <div class="stat-label">Chapters</div>
          </div>
        </div>
      </div>
    </header>

    <nav class="sticky-bar" aria-label="章节与阅读工具">
      <div class="toolbar-inner">
        <div class="chapter-nav" id="chapterNav"></div>
        <div class="controls">
          <button class="ctrl-btn" id="voiceModeBtn" type="button" title="切换固定音色或随机美式音色">固定音色</button>
          <button class="ctrl-btn" id="fontBtn" type="button" title="切换字号">A+</button>
          <button class="ctrl-btn" id="cnToggleBtn" type="button" title="隐藏或显示中文译文">遮罩中文</button>
          <button class="ctrl-btn" id="themeBtn" type="button" title="切换深浅色主题">深色</button>
        </div>
      </div>
    </nav>

    <main id="magazineContent"></main>

    <footer class="colophon">
      <div class="colophon-brand">
        <strong>Motegi Spoken English Journal</strong>
        <span aria-hidden="true">·</span>
        <a
          class="colophon-link"
          href="https://youtu.be/VcDJzNc2g6s"
          target="_blank"

        >Watch Original Vlog ↗</a>
      </div>
    </footer>
  </div>

  <div class="tts-toast" id="ttsToast" role="status" aria-live="polite"></div>

  <script>
    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById("ttsToast");
      if (!el) return;
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
    }

    const AudioCache = {
      dbName: "tts_audio_cache_v1",
      storeName: "audio_clips",
      ttlMs: 7 * 24 * 60 * 60 * 1000, // 本地缓存 1 周（7 天）
      _dbPromise: null,

      open() {
        if (!("indexedDB" in window)) return Promise.resolve(null);
        if (this._dbPromise) return this._dbPromise;

        this._dbPromise = new Promise((resolve) => {
          try {
            const req = indexedDB.open(this.dbName, 1);
            req.onupgradeneeded = () => {
              const db = req.result;
              if (!db.objectStoreNames.contains(this.storeName)) {
                const store = db.createObjectStore(this.storeName, { keyPath: "key" });
                store.createIndex("expiresAt", "expiresAt", { unique: false });
              }
            };
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => resolve(null);
            req.onblocked = () => resolve(null);
          } catch (_) {
            resolve(null);
          }
        });
        return this._dbPromise;
      },

      async get(key) {
        const db = await this.open();
        if (!db) return null;
        return new Promise((resolve) => {
          try {
            const tx = db.transaction(this.storeName, "readonly");
            const req = tx.objectStore(this.storeName).get(key);
            req.onsuccess = () => {
              const record = req.result;
              if (!record || !record.blob) {
                resolve(null);
                return;
              }
              if (record.expiresAt <= Date.now()) {
                this.del(key);
                resolve(null);
                return;
              }
              resolve(record.blob);
            };
            req.onerror = () => resolve(null);
          } catch (_) {
            resolve(null);
          }
        });
      },

      async set(key, blob) {
        const db = await this.open();
        if (!db || !blob) return;
        return new Promise((resolve) => {
          try {
            const now = Date.now();
            const tx = db.transaction(this.storeName, "readwrite");
            tx.objectStore(this.storeName).put({
              key,
              blob,
              createdAt: now,
              expiresAt: now + this.ttlMs
            });
            tx.oncomplete = () => resolve(true);
            tx.onerror = () => resolve(false);
          } catch (_) {
            resolve(false);
          }
        });
      },

      async del(key) {
        const db = await this.open();
        if (!db) return;
        return new Promise((resolve) => {
          try {
            const tx = db.transaction(this.storeName, "readwrite");
            tx.objectStore(this.storeName).delete(key);
            tx.oncomplete = () => resolve();
            tx.onerror = () => resolve();
          } catch (_) {
            resolve();
          }
        });
      },

      async pruneExpired() {
        const db = await this.open();
        if (!db) return;
        try {
          const tx = db.transaction(this.storeName, "readwrite");
          const index = tx.objectStore(this.storeName).index("expiresAt");
          const range = IDBKeyRange.upperBound(Date.now());
          const req = index.openCursor(range);
          req.onsuccess = () => {
            const cursor = req.result;
            if (cursor) {
              cursor.delete();
              cursor.continue();
            }
          };
        } catch (_) {}
      }
    };

    const TTS = {
      defaultVoice: "en-US-EricNeural",

      englishVoices: [
        "en-US-AdamNeural", "en-US-AriaNeural", "en-US-AnaNeural", "en-US-AndrewNeural", "en-US-AvaNeural",
        "en-US-BrianNeural", "en-US-ChristopherNeural", "en-US-CoraNeural", "en-US-DavisNeural", "en-US-ElizabethNeural",
        "en-US-EricNeural", "en-US-GuyNeural", "en-US-JennyNeural", "en-US-MichelleNeural", "en-US-RogerNeural",
        "en-US-SteffanNeural", "en-US-TonyNeural"

                cn: "今天拿到了围场通行证，我会尽量给你们多拍点画面。"
              },
              {
                en: "I'm trying to practice speaking Japanese <mark>as much as I can</mark> during this trip.",
                cn: "这趟旅行我尽量能多说日语就多开口练练。"
              },
              {
                en: "Let's walk around the pit lane and soak it all in <mark>as much as we can</mark> before the crowd swells.",
                cn: "趁着人还没多起来，咱们在维修区通道多转转，能感受多少是多少。"
              }
            ]
          }
        ]
      },
      {
        id: "trackside",
        roman: "IV.",
        title: "Trackside Banter & Victory",
        cn: "赛场反应、吐槽与高光时刻",
        items: [
          {
            en: "is that just me?",
            cn: "只有我一个人这么觉得吗？",
            examples: [
              {
                en: "Does that green mascot look just like the Duolingo owl, or <mark>is that just me?</mark>",
                cn: "那个绿色吉祥物是不是长得特像多邻国猫头鹰，还是只有我这么觉得？"
              },
              {
                en: "This iced coffee tastes weirdly salty—<mark>is that just me?</mark>",
                cn: "这杯冰咖啡喝着怎么怪咸的——只有我尝出来了吗？"
              },
              {
                en: "Does the crowd sound twice as loud on the final lap, or <mark>is that just me?</mark>",
                cn: "最后一圈观众欢呼声是不是直接翻倍了，还是我的错觉？"
              }
            ]
          },
          {
            en: "am I tripping?",
            cn: "是我眼花/神志不清了吗？（口语常见吐槽）",
            examples: [
              {
                en: "Wait, <mark>am I tripping</mark>, or did a GT-R just roll right past the hotel entrance?",
                cn: "等等，是我眼花了吗，刚才是不是有辆 GT-R 从酒店门口开过去了？"
              },
              {
                en: "<mark>Am I tripping</mark>, or did this train ticket cost twice as much yesterday?",
                cn: "我是不是记错了，这张车票昨天怎么好像没这么贵？"
              },
              {
                en: "Hold on, <mark>am I tripping</mark> or is that rider leaning so low his elbow's scraping the curb?",
                cn: "等一下，没看错吧，那车手压弯低到手肘都要擦到路肩了？"
              }
            ]
          },
          {
            en: "no way",
            cn: "不可能吧；不是吧；太绝了",
            examples: [
              {
                en: "<mark>No way</mark>! They actually have tiny Honda cookies at the souvenir stand!",
                cn: "不是吧！纪念品摊位居然还卖迷你本田小饼干！"
              },
              {
                en: "<mark>No way</mark> you managed to score front-row seats on race morning.",
                cn: "不可能吧，你比赛当天早上居然还能抢到第一排座位。"
              },
              {
                en: "Wait, we don't have a single 500-yen coin for the capsule machine? <mark>No way</mark>!",
                cn: "什么，咱们身上连一枚 500 日元硬币都凑不出来扭蛋？不会吧！"
              }
            ]
          },
          {
            en: "feels good, doesn't it?",
            cn: "感觉很爽，对吧？",
            examples: [
              {
                en: "Stepping into the air-conditioned hospitality tent after three hours in the sun—<mark>feels good, doesn't it?</mark>",
                cn: "在太阳底下晒了三小时后钻进空调帐篷——这感觉特爽，对吧？"
              },
              {
                en: "Taking off your helmet and feeling the evening breeze <mark>feels good, doesn't it?</mark>",
                cn: "摘下头盔吹着傍晚的微风，特舒服对吧？"
              },
              {
                en: "Hearing the whole grandstand erupt when your favorite team takes P1 <mark>feels good, doesn't it?</mark>",
                cn: "喜欢的车队冲到第一时全场沸腾的感觉，很过瘾对吧？"
              }
            ]
          },
          {
            en: "this is what sth. feels like",
            cn: "原来这就是……的感觉",
            examples: [
              {
                en: "Oh my god, finally—<mark>this is what victory feels like</mark>!",
                cn: "天哪，终于等到了——原来这就是夺冠胜利的感觉！"
              },
              {
                en: "Waking up in the mountains with zero emails to answer: <mark>this is what pure peace feels like</mark>.",
                cn: "在山里醒来一封工作邮件都不用回：原来这就是纯粹的平静。"
              },
              {
                en: "Nailing a clean lap after months of practice—<mark>this is what real progress feels like</mark>.",
                cn: "练了几个月终于跑出漂亮的一圈——这就是实打实进步的感觉。"
              }
            ]
          }
        ]
      }
    ];

    const speakerSvg = `
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
      </svg>
    `;

    function stripHtml(html) {
      const tmp = document.createElement("div");
      tmp.innerHTML = html;
      return tmp.textContent || tmp.innerText || "";
    }

    function renderMagazine() {
      const navEl = document.getElementById("chapterNav");
      const mainEl = document.getElementById("magazineContent");
      let counter = 1;

      MAGAZINE_DATA.forEach((chapter, idx) => {
        const pill = document.createElement("a");
        pill.className = "nav-pill" + (idx === 0 ? " active" : "");
        pill.href = `#${chapter.id}`;
        pill.textContent = `${chapter.roman} ${chapter.cn}`;
        pill.dataset.target = chapter.id;
        navEl.appendChild(pill);

        const section = document.createElement("section");
        section.className = "chapter";
        section.id = chapter.id;

        let entriesHtml = "";
        chapter.items.forEach((item) => {
          const num = String(counter++).padStart(2, "0");
          const cleanPhrase = item.en
            .replace(/\.\.\./g, " ")
            .replace(/sb\./g, "somebody")
            .replace(/sth\./g, "something");

          const examplesHtml = item.examples
            .map((ex) => {
              const plainText = stripHtml(ex.en).replace(/"/g, "&quot;");
              return `
                <div class="example-card">
                  <div class="example-en-row">
                    <p class="example-en">${ex.en}</p>
                    <button class="line-speak" type="button" data-speech="${plainText}" aria-label="朗读例句" title="点击朗读">
                      ${speakerSvg}
                    </button>
                  </div>
                  <p class="example-cn">${ex.cn}</p>
                </div>
              `;
            })
            .join("");

          entriesHtml += `
            <article class="entry">
              <div class="entry-top">
                <div class="entry-index">${num}</div>
                <div class="entry-heading">
                  <div class="phrase-row">
                    <h3 class="phrase-en">${item.en}</h3>
                    <button class="phrase-speak" type="button" data-speech="${cleanPhrase.replace(/"/g, "&quot;")}" aria-label="朗读词组" title="点击朗读">
                      ${speakerSvg}
                    </button>
                  </div>
                  <div class="phrase-cn">${item.cn}</div>
                </div>
              </div>
              <div class="examples">
                ${examplesHtml}
              </div>
            </article>
          `;
        });

        section.innerHTML = `
          <div class="chapter-head">
            <div class="chapter-title-wrap">
              <span class="chapter-roman">${chapter.roman}</span>
              <h2 class="chapter-title">${chapter.title}</h2>
            </div>
            <span class="chapter-cn">${chapter.cn}</span>
          </div>
          ${entriesHtml}
        `;

        mainEl.appendChild(section);
      });
    }

    // Speaker Button State Controller
    let activeSpeakBtn = null;
    let useRandomVoice = localStorage.getItem("motegi_random_voice") === "1";

    function resetSpeakBtn(btn) {
      if (!btn) return;
      btn.classList.remove("loading", "speaking");
    }

    function speakText(text, btn) {
      if (activeSpeakBtn === btn) {
        TTS.stop();
        resetSpeakBtn(btn);
        activeSpeakBtn = null;
        return;
      }

      if (activeSpeakBtn) {
        resetSpeakBtn(activeSpeakBtn);
      }

      activeSpeakBtn = btn;
      btn.classList.add("loading");

      const voice = useRandomVoice ? TTS.getRandomEnVoice() : TTS.defaultVoice;
      TTS.play(text, voice, {
        onPlay: () => {
          if (activeSpeakBtn === btn) {
            btn.classList.remove("loading");
            btn.classList.add("speaking");
          }
        },
        onEnd: () => {
          if (activeSpeakBtn === btn) {
            resetSpeakBtn(btn);
            activeSpeakBtn = null;
          }
        }
      });
    }

    // Interactive Controls
    function setupControls() {
      const voiceModeBtn = document.getElementById("voiceModeBtn");
      const themeBtn = document.getElementById("themeBtn");
      const cnToggleBtn = document.getElementById("cnToggleBtn");
      const fontBtn = document.getElementById("fontBtn");
      const htmlEl = document.documentElement;

      const syncVoiceBtn = () => {
        voiceModeBtn.textContent = useRandomVoice ? "随机音色" : "固定音色";
        voiceModeBtn.classList.toggle("is-active", useRandomVoice);
      };
      syncVoiceBtn();

      voiceModeBtn.addEventListener("click", () => {
        useRandomVoice = !useRandomVoice;
        localStorage.setItem("motegi_random_voice", useRandomVoice ? "1" : "0");
        syncVoiceBtn();
        showToast(useRandomVoice ? "已切换为随机美式 Neural 音色" : "已切换为默认音色 (EricNeural)");
      });

      const savedTheme = localStorage.getItem("motegi_theme");
      if (savedTheme === "dark") {
        htmlEl.setAttribute("data-theme", "dark");
        themeBtn.textContent = "浅色";
      }

      themeBtn.addEventListener("click", () => {
        const isDark = htmlEl.getAttribute("data-theme") === "dark";
        if (isDark) {
          htmlEl.removeAttribute("data-theme");
          themeBtn.textContent = "深色";
          localStorage.setItem("motegi_theme", "light");
        } else {
          htmlEl.setAttribute("data-theme", "dark");
          themeBtn.textContent = "浅色";
          localStorage.setItem("motegi_theme", "dark");
        }
      });

      cnToggleBtn.addEventListener("click", () => {
        const hidden = document.body.classList.toggle("hide-cn");
        cnToggleBtn.classList.toggle("is-active", hidden);
        cnToggleBtn.textContent = hidden ? "显示中文" : "遮罩中文";
        if (!hidden) {
          document.querySelectorAll(".example-cn.revealed").forEach((el) => el.classList.remove("revealed"));
        }
      });

      const sizes = [16, 18, 20];
      let sizeIdx = 0;
      fontBtn.addEventListener("click", () => {
        sizeIdx = (sizeIdx + 1) % sizes.length;
        htmlEl.style.setProperty("--base-size", sizes[sizeIdx] + "px");
        fontBtn.textContent = sizeIdx === 0 ? "A+" : sizeIdx === 1 ? "A++" : "A";
        fontBtn.classList.toggle("is-active", sizeIdx > 0);
      });

      document.getElementById("magazineContent").addEventListener("click", (e) => {
        const speakBtn = e.target.closest("[data-speech]");
        if (speakBtn) {
          speakText(speakBtn.dataset.speech, speakBtn);
          return;
        }
        const cnEl = e.target.closest(".example-cn");
        if (cnEl && document.body.classList.contains("hide-cn")) {
          cnEl.classList.toggle("revealed");
        }
      });

      const pills = Array.from(document.querySelectorAll(".nav-pill"));
      const chapters = Array.from(document.querySelectorAll(".chapter"));
      const observer = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              pills.forEach((p) => p.classList.toggle("active", p.dataset.target === entry.target.id));
            }
          });
        },
        { rootMargin: "-25% 0px -65% 0px" }
      );
      chapters.forEach((c) => observer.observe(c));
    }

    renderMagazine();
    setupControls();
    setTimeout(() => AudioCache.pruneExpired(), 1500);
    if ("speechSynthesis" in window) {
      window.speechSynthesis.getVoices();
    }
  </script>
</body>
