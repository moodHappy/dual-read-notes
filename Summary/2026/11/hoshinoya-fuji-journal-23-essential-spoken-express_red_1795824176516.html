<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="referrer" content="no-referrer" />
  <title>HOSHINOYA FUJI JOURNAL — 23 Essential Spoken Expressions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F5F0E1;
      --surface: #FAF7EE;
      --surface-tint: #E5EBDD;
      --ink: #1C1E1B;
      --ink-secondary: #535850;
      --ink-muted: #848980;
      --accent: #2C4A3B;
      --accent-soft: rgba(44, 74, 59, 0.11);
      --rust: #9A4D36;
      --rule: rgba(28, 30, 27, 0.14);
      --rule-strong: rgba(28, 30, 27, 0.72);
      --mark-bg: #E5EBDD;
      --mark-ink: #1E3A2C;
      --shadow: 0 1px 2px rgba(28, 30, 27, 0.04);
      --font-serif: "Cormorant Garamond", "Georgia", "Songti SC", "Noto Serif SC", serif;
      --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --base-size: 16px;
    }

    [data-theme="dark"] {
      --bg: #161816;
      --surface: #1D201D;
      --surface-tint: #252B25;
      --ink: #E8E3D5;
      --ink-secondary: #A9AEA5;
      --ink-muted: #767B73;
      --accent: #8FB39C;
      --accent-soft: rgba(143, 179, 156, 0.14);
      --rust: #D4886E;
      --rule: rgba(232, 227, 213, 0.13);
      --rule-strong: rgba(232, 227, 213, 0.65);
      --mark-bg: rgba(143, 179, 156, 0.18);
      --mark-ink: #C5DFCE;
      --shadow: none;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
      font-size: var(--base-size);
      background: var(--bg);
    }

    body {
      background-color: var(--bg);
      color: var(--ink);
      font-family: var(--font-sans);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      transition: background-color 0.28s ease, color 0.28s ease;
      padding-bottom: env(safe-area-inset-bottom, 24px);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.028;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .page {
      position: relative;
      z-index: 1;
      max-width: 820px;
      margin: 0 auto;
      padding: 0 24px 72px;
    }

    /* Masthead */
    .masthead {
      padding-top: 28px;
      padding-bottom: 24px;
      border-bottom: 3px double var(--rule-strong);
    }

    .cover-header {
      padding: 12px 0 8px;
      text-align: center;
    }

    .kicker {
      display: inline-block;
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 12px;
    }

    .cover-title {
      font-family: var(--font-serif);
      font-size: clamp(2.5rem, 7.5vw, 4.4rem);
      font-weight: 600;
      line-height: 0.98;
      letter-spacing: -0.02em;
      color: var(--ink);
      margin-bottom: 14px;
    }

    .cover-title em {
      font-style: italic;
      font-weight: 500;
      color: var(--accent);
    }

    .cover-deck {
      max-width: 560px;
      margin: 0 auto;
      font-size: 0.94rem;
      color: var(--ink-secondary);
      line-height: 1.7;
    }

    .editorial-stats {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--rule);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      text-align: center;
      gap: 8px;
    }

    .stat-num {
      font-family: var(--font-serif);
      font-size: 1.55rem;
      font-weight: 600;
      line-height: 1.1;
      color: var(--ink);
    }

    .stat-label {
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-top: 3px;
    }

    /* Sticky Utility Navigation */
    .sticky-bar {
      position: sticky;
      top: 0;
      z-index: 30;
      margin: 0 -24px 28px;
      padding: 10px 24px;
      background: color-mix(in srgb, var(--bg) 90%, transparent);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--rule);
    }

    .toolbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .chapter-nav {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding: 2px 0;
    }

    .chapter-nav::-webkit-scrollbar {
      display: none;
    }

    .nav-pill {
      flex: 0 0 auto;
      text-decoration: none;
      font-size: 0.74rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--ink-secondary);
      padding: 5px 11px;
      border-radius: 999px;
      border: 1px solid var(--rule);
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .nav-pill:hover,
    .nav-pill.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #FAF7EE;
    }

    [data-theme="dark"] .nav-pill:hover,
    [data-theme="dark"] .nav-pill.active {
      color: #161816;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .ctrl-btn {
      appearance: none;
      border: 1px solid var(--rule);
      background: var(--surface);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 0.74rem;
      font-weight: 500;
      height: 30px;
      padding: 0 10px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .ctrl-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .ctrl-btn.is-active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Section Headers */
    .chapter {
      margin-top: 42px;
      scroll-margin-top: 66px;
    }

    .chapter:first-of-type {
      margin-top: 8px;
    }

    .chapter-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 12px;
      margin-bottom: 8px;
      border-bottom: 2px solid var(--rule-strong);
    }

    .chapter-title-wrap {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .chapter-roman {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 1.45rem;
      font-weight: 600;
      color: var(--rust);
    }

    .chapter-title {
      font-family: var(--font-serif);
      font-size: 1.55rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--ink);
    }

    .chapter-cn {
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      color: var(--ink-muted);
      white-space: nowrap;
    }

    /* Editorial Entry */
    .entry {
      padding: 26px 0 28px;
      border-bottom: 1px solid var(--rule);
    }

    .entry:last-child {
      border-bottom: none;
    }

    .entry-top {
      display: grid;
      grid-template-columns: 54px 1fr;
      gap: 14px;
      align-items: start;
      margin-bottom: 18px;
    }

    .entry-index {
      font-family: var(--font-serif);
      font-size: 2.35rem;
      font-weight: 500;
      line-height: 0.88;
      color: var(--ink-muted);
      opacity: 0.58;
      letter-spacing: -0.03em;
      user-select: none;
    }

    .entry-heading {
      min-width: 0;
    }

    .phrase-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }

    .phrase-en {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 4.2vw, 1.9rem);
      font-weight: 700;
      line-height: 1.18;
      color: var(--ink);
      letter-spacing: -0.01em;
      word-break: break-word;
    }

    .phrase-speak,
    .line-speak {
      position: relative;
      flex-shrink: 0;
      border: none;
      background: transparent;
      color: var(--ink-muted);
      border-radius: 50%;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .phrase-speak {
      width: 34px;
      height: 34px;
    }

    .line-speak {
      margin-top: 2px;
      width: 30px;
      height: 30px;
    }

    .phrase-speak:hover,
    .line-speak:hover,
    .phrase-speak.speaking,
    .line-speak.speaking,
    .phrase-speak.loading,
    .line-speak.loading {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .phrase-speak.loading::after,
    .line-speak.loading::after {
      content: "";
      position: absolute;
      inset: 2px;
      border-radius: 50%;
      border: 1.6px solid transparent;
      border-top-color: var(--accent);
      animation: ttsSpin 0.8s linear infinite;
    }

    @keyframes ttsSpin {
      to { transform: rotate(360deg); }
    }

    .phrase-speak.speaking,
    .line-speak.speaking {
      animation: speakPulse 1.3s ease-in-out infinite;
    }

    @keyframes speakPulse {
      0%, 100% {
        box-shadow: 0 0 0 0 var(--accent-soft);
      }
      50% {
        box-shadow: 0 0 0 5px transparent;
      }
    }

    .phrase-cn {
      margin-top: 6px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.88rem;
      color: var(--accent);
      font-weight: 500;
    }

    .phrase-cn::before {
      content: "";
      display: inline-block;
      width: 14px;
      height: 1px;
      background: var(--rust);
    }

    /* Examples Column */
    .examples {
      margin-left: 68px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .example-card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--rule);
      border-left: 2.5px solid var(--accent);
      border-radius: 2px 8px 8px 2px;
      padding: 13px 16px;
      box-shadow: var(--shadow);
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .example-card:hover {
      border-left-color: var(--rust);
    }

    .example-en-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .example-en {
      font-size: 0.98rem;
      line-height: 1.62;
      color: var(--ink);
      font-weight: 400;
    }

    .example-en mark {
      background: var(--mark-bg);
      color: var(--mark-ink);
      font-weight: 600;
      padding: 1px 5px;
      border-radius: 3px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }

    .example-cn {
      margin-top: 6px;
      font-size: 0.86rem;
      line-height: 1.55;
      color: var(--ink-secondary);
      transition: filter 0.22s ease, opacity 0.22s ease;
    }

    /* Hide Chinese Mode (Tap to reveal) */
    body.hide-cn .example-cn {
      filter: blur(5px);
      opacity: 0.32;
      user-select: none;
      cursor: pointer;
    }

    body.hide-cn .example-cn.revealed {
      filter: none;
      opacity: 1;
      user-select: text;
    }

    /* Colophon Footer */
    .colophon {
      margin-top: 56px;
      padding-top: 22px;
      border-top: 3px double var(--rule-strong);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 0.74rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }

    .colophon-brand {
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .colophon strong {
      font-family: var(--font-serif);
      font-size: 0.98rem;
      font-style: italic;
      text-transform: none;
      letter-spacing: 0.02em;
      color: var(--ink-secondary);
      font-weight: 600;
    }

    .colophon-link {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
      padding-bottom: 1px;
      font-weight: 500;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .colophon-link:hover {
      color: var(--rust);
      border-color: var(--rust);
    }

    /* Subtle non-intrusive status toast */
    .tts-toast {
      position: fixed;
      left: 50%;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%) translateY(12px);
      z-index: 60;
      background: var(--ink);
      color: var(--bg);
      font-size: 0.76rem;
      letter-spacing: 0.03em;
      padding: 7px 14px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
      max-width: calc(100vw - 32px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tts-toast.show {
      opacity: 0.92;
      transform: translateX(-50%) translateY(0);
    }

    /* Mobile Optimization */
    @media (max-width: 640px) {
      .page {
        padding: 0 16px 56px;
      }

      .masthead {
        padding-top: 20px;
        padding-bottom: 18px;
      }

      .cover-header {
        padding: 8px 0 6px;
      }

      .cover-deck {
        font-size: 0.88rem;
      }

      .sticky-bar {
        margin: 0 -16px 20px;
        padding: 9px 16px;
      }

      .toolbar-inner {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
      }

      .controls {
        justify-content: flex-end;
      }

      .chapter {
        margin-top: 34px;
        scroll-margin-top: 96px;
      }

      .chapter-head {
        flex-direction: column;
        gap: 3px;
        padding-bottom: 10px;
      }

      .chapter-title {
        font-size: 1.38rem;
      }

      .entry {
        padding: 22px 0 24px;
      }

      .entry-top {
        grid-template-columns: 38px 1fr;
        gap: 10px;
        margin-bottom: 14px;
      }

      .entry-index {
        font-size: 1.85rem;
      }

      .examples {
        margin-left: 0;
        gap: 10px;
      }

      .example-card {
        padding: 12px 13px;
      }

      .example-en {
        font-size: 0.96rem;
      }

      .example-cn {
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <div class="cover-header">
        <span class="kicker">Curated Glamping Vlog Lexicon</span>
        <h1 class="cover-title">Fireside <em>Idioms</em><br />at Hoshinoya Fuji</h1>
        <p class="cover-deck">
          精选星野虹夕诺雅富士 72 小时露营 Vlog 中最鲜活、接地气的 23 组英语口语表达。从山林入住、干饭狂炫到雨天松弛闲聊，每一条均配有三句日常对话例句。
        </p>

        <div class="editorial-stats">
          <div>
            <div class="stat-num">23</div>
            <div class="stat-label">Expressions</div>
          </div>
          <div>
            <div class="stat-num">69</div>
            <div class="stat-label">Spoken Lines</div>
          </div>
          <div>
            <div class="stat-num">04</div>
            <div class="stat-label">Chapters</div>
          </div>
        </div>
      </div>
    </header>

    <nav class="sticky-bar" aria-label="章节与阅读工具">
      <div class="toolbar-inner">
        <div class="chapter-nav" id="chapterNav"></div>
        <div class="controls">
          <button class="ctrl-btn" id="voiceModeBtn" type="button" title="切换固定音色或随机美式音色">固定音色</button>
          <button class="ctrl-btn" id="fontBtn" type="button" title="切换字号">A+</button>
          <button class="ctrl-btn" id="cnToggleBtn" type="button" title="隐藏或显示中文译文">遮罩中文</button>
          <button class="ctrl-btn" id="themeBtn" type="button" title="切换深浅色主题">深色</button>
        </div>
      </div>
    </nav>

    <main id="magazineContent"></main>

    <footer class="colophon">
      <div class="colophon-brand">
        <strong>Hoshinoya Fuji Spoken English Journal</strong>
        <span aria-hidden="true">·</span>
        <a
          class="colophon-link"
          href="https://youtu.be/EJj7oV5yoss"
          target="_blank"
          rel="noopener noreferrer"
        >Watch Original Vlog ↗</a>
      </div>
    </footer>
  </div>

  <div class="tts-toast" id="ttsToast" role="status" aria-live="polite"></div>

  <script>
    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById("ttsToast");
      if (!el) return;
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
    }

    // 7-Day IndexedDB + In-Memory Audio Cache
    const TTSCache = {
      DB_NAME: "tts_audio_cache_v1",
      STORE_NAME: "audio_clips",
      DB_VERSION: 1,
      TTL_MS: 7 * 24 * 60 * 60 * 1000, // 本地缓存 1 周（7 天）
      _dbPromise: null,
      _memCache: new Map(),

      open() {
        if (this._dbPromise) return this._dbPromise;
        if (!("indexedDB" in window)) {
          this._dbPromise = Promise.resolve(null);
          return this._dbPromise;
        }
        this._dbPromise = new Promise((resolve) => {
          try {
            const req = indexedDB.open(this.DB_NAME, this.DB_VERSION);
            req.onupgradeneeded = (e) => {
              const db = e.target.result;
              if (!db.objectStoreNames.contains(this.STORE_NAME)) {
                const store = db.createObjectStore(this.STORE_NAME, { keyPath: "key" });
                store.createIndex("expiresAt", "expiresAt", { unique: false });
              }
            };
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => resolve(null);
            req.onblocked = () => resolve(null);
          } catch {
            resolve(null);
          }
        });
        return this._dbPromise;
      },

      getSyncUrl(key) {
        const hit = this._memCache.get(key);
        if (!hit) return null;
        if (Date.now() >= hit.expiresAt) {
          URL.revokeObjectURL(hit.url);
          this._memCache.delete(key);
          this.delete(key);
          return null;
        }
        return hit.url;
      },

      rememberBlob(key, blob, expiresAt) {
        const prev = this._memCache.get(key);
        if (prev) URL.revokeObjectURL(prev.url);
        const url = URL.createObjectURL(blob);
        this._memCache.set(key, { url, expiresAt });
        return url;
      },

      async getUrl(key) {
        const memUrl = this.getSyncUrl(key);
        if (memUrl) return memUrl;

        const db = await this.open();
        if (!db) return null;

        return new Promise((resolve) => {
          try {
            const tx = db.transaction(this.STORE_NAME, "readonly");
            const req = tx.objectStore(this.STORE_NAME).get(key);
            req.onsuccess = () => {
              const record = req.result;
              if (!record || !record.blob) {
                resolve(null);
                return;
              }
              if (Date.now() >= record.expiresAt) {
                this.delete(key);
                resolve(null);
                return;
              }
              resolve(this.rememberBlob(key, record.blob, record.expiresAt));
            };
            req.onerror = () => resolve(null);
          } catch {
            resolve(null);
          }
        });
      },

      async set(key, blob) {
        const expiresAt = Date.now() + this.TTL_MS;
        const url = this.rememberBlob(key, blob, expiresAt);

        const db = await this.open();
        if (!db) return url;

        try {
          const tx = db.transaction(this.STORE_NAME, "readwrite");
          tx.objectStore(this.STORE_NAME).put({
            key,
            blob,
            savedAt: Date.now(),
            expiresAt
          });
        } catch {}
        return url;
      },

      async delete(key) {
        const db = await this.open();
        if (!db) return;
        try {
          const tx = db.transaction(this.STORE_NAME, "readwrite");
          tx.objectStore(this.STORE_NAME).delete(key);
        } catch {}
      },

      async pruneExpired() {
        const db = await this.open();
        if (!db) return;
        try {
          const tx = db.transaction(this.STORE_NAME, "readwrite");
          const store = tx.objectStore(this.STORE_NAME);
          const now = Date.now();
          const req = store.openCursor();
          req.onsuccess = (e) => {
            const cursor = e.target.result;
            if (!cursor) return;
            if (cursor.value && cursor.value.expiresAt <= now) {
              cursor.delete();

      },
      {

        roman: "IV.",
        title: "Rainy Moments & Spontaneous Fun",

                cn: "等等，什么意思，你居然从没在真篝火上烤过棉花糖？"
              }
            ]
          },
          {
            en: "didn't expect to",
            cn: "没料到会……；没想到居然要……",
            examples: [
              {
                en: "I <mark>didn't expect to</mark> be chopping wood today, so I wore a denim skirt like a genius.",

              },
              {

              {

                cn: "台风季我们压根没指望能看见富士山，所以露那一下简直太神奇了。"
              }
            ]
          },
          {
            en: "get bit by",
            cn: "被（蚊虫等）咬了（超地道美/澳口语用法）",
            examples: [
              {
                en: "Put on bug spray right now—I just <mark>got bit by</mark> like ten mosquitoes in five minutes.",
                cn: "赶紧喷驱蚊水——我刚五分钟就被蚊子叮了差不多十个包。"
              },
              {
                en: "Why do I always <mark>get bit by</mark> every single mosquito while you don't have one mark?",
                cn: "凭啥每次蚊子全盯着我咬，你身上连一个包都没有？"
              },
              {
                en: "Careful sitting near the tall grass unless you wanna <mark>get bit by</mark> bugs all evening.",
                cn: "坐在高草丛旁边小心点，除非你想一整个晚上喂蚊子。"
              }
            ]
          },
          {
            en: "I wish I had ...",
            cn: "要是我有……就好了；真想来点……",
            examples: [
              {
                en: "This breakfast spread is insane, though <mark>I wish I had</mark> a cold glass of orange juice.",
                cn: "这顿早餐丰盛到离谱，不过要是有杯冰橙汁就更绝了。"
              },
              {
                en: "<mark>I wish I had</mark> packed a thicker sweater—mountain nights get chilly fast.",
                cn: "真后悔没带件厚点的毛衣，山里晚上降温太快了。"
              },
              {
                en: "<mark>I wish I had</mark> a zoom lens on me right now so you guys could see the snow peak.",
                cn: "真希望手头带了长焦镜头，这样你们就能看清雪顶了。"
              }
            ]
          },
          {
            en: "how crazy is this",
            cn: "这也太离谱/太震撼了吧",
            examples: [
              {
                en: "Look at the clouds parting right in front of the peak—<mark>how crazy is this</mark>?",
                cn: "快看云层就在山峰正前方散开了——这也太震撼了吧？"
              },
              {
                en: "A hundred and fifty bucks for one steak? Dude, <mark>how crazy is this</mark> menu?",
                cn: "一块牛排要一百五十美元？哥们儿，这菜单价格也太离谱了吧？"
              },
              {
                en: "From pouring rain to bright blue skies in twenty minutes—<mark>how crazy is this</mark> weather?",
                cn: "二十分钟就从倾盆大雨变成大晴天——这天气也太神奇了吧？"
              }
            ]
          }
        ]
      }
    ];

    const speakerSvg = `
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
      </svg>
    `;

    function stripHtml(html) {
      const tmp = document.createElement("div");
      tmp.innerHTML = html;
      return tmp.textContent || tmp.innerText || "";
    }

    function renderMagazine() {
      const navEl = document.getElementById("chapterNav");
      const mainEl = document.getElementById("magazineContent");
      let counter = 1;

      MAGAZINE_DATA.forEach((chapter, idx) => {
        const pill = document.createElement("a");
        pill.className = "nav-pill" + (idx === 0 ? " active" : "");
        pill.href = `#${chapter.id}`;
        pill.textContent = `${chapter.roman} ${chapter.cn}`;
        pill.dataset.target = chapter.id;
        navEl.appendChild(pill);

        const section = document.createElement("section");
        section.className = "chapter";
        section.id = chapter.id;

        let entriesHtml = "";
        chapter.items.forEach((item) => {
          const num = String(counter++).padStart(2, "0");
          const cleanPhrase = item.en
            .replace(/\.\.\./g, " ")
            .replace(/sb\./g, "somebody")
            .replace(/sth\./g, "something");

          const examplesHtml = item.examples
            .map((ex) => {
              const plainText = stripHtml(ex.en).replace(/"/g, "&quot;");
              return `
                <div class="example-card">
                  <div class="example-en-row">
                    <p class="example-en">${ex.en}</p>
                    <button class="line-speak" type="button" data-speech="${plainText}" aria-label="朗读例句" title="点击朗读">
                      ${speakerSvg}
                    </button>
                  </div>
                  <p class="example-cn">${ex.cn}</p>
                </div>
              `;
            })
            .join("");

          entriesHtml += `
            <article class="entry">
              <div class="entry-top">
                <div class="entry-index">${num}</div>
                <div class="entry-heading">
                  <div class="phrase-row">
                    <h3 class="phrase-en">${item.en}</h3>
                    <button class="phrase-speak" type="button" data-speech="${cleanPhrase.replace(/"/g, "&quot;")}" aria-label="朗读词组" title="点击朗读">
                      ${speakerSvg}
                    </button>
                  </div>
                  <div class="phrase-cn">${item.cn}</div>
                </div>
              </div>
              <div class="examples">
                ${examplesHtml}
              </div>
            </article>
          `;
        });

        section.innerHTML = `
          <div class="chapter-head">
            <div class="chapter-title-wrap">
              <span class="chapter-roman">${chapter.roman}</span>
              <h2 class="chapter-title">${chapter.title}</h2>
            </div>
            <span class="chapter-cn">${chapter.cn}</span>
          </div>
          ${entriesHtml}
        `;

        mainEl.appendChild(section);
      });
    }

    // Speaker Button State Controller
    let activeSpeakBtn = null;
    let useRandomVoice = localStorage.getItem("hoshinoya_random_voice") === "1";

    function resetSpeakBtn(btn) {
      if (!btn) return;
      btn.classList.remove("loading", "speaking");
    }

    function speakText(text, btn) {
      if (activeSpeakBtn === btn) {
        TTS.stop();
        resetSpeakBtn(btn);
        activeSpeakBtn = null;
        return;
      }

      if (activeSpeakBtn) {
        resetSpeakBtn(activeSpeakBtn);
      }

      activeSpeakBtn = btn;
      btn.classList.add("loading");

      const voice = useRandomVoice ? TTS.getRandomEnVoice() : TTS.defaultVoice;
      TTS.play(text, voice, {
        onPlay: () => {
          if (activeSpeakBtn === btn) {
            btn.classList.remove("loading");
            btn.classList.add("speaking");
          }
        },
        onEnd: () => {
          if (activeSpeakBtn === btn) {
            resetSpeakBtn(btn);
            activeSpeakBtn = null;
          }
        }
      });
    }

    // Interactive Controls
    function setupControls() {
      const voiceModeBtn = document.getElementById("voiceModeBtn");
      const themeBtn = document.getElementById("themeBtn");
      const cnToggleBtn = document.getElementById("cnToggleBtn");
      const fontBtn = document.getElementById("fontBtn");
      const htmlEl = document.documentElement;

      const syncVoiceBtn = () => {
        voiceModeBtn.textContent = useRandomVoice ? "随机音色" : "固定音色";
        voiceModeBtn.classList.toggle("is-active", useRandomVoice);
      };
      syncVoiceBtn();

      voiceModeBtn.addEventListener("click", () => {
        useRandomVoice = !useRandomVoice;
        localStorage.setItem("hoshinoya_random_voice", useRandomVoice ? "1" : "0");
        syncVoiceBtn();
        showToast(useRandomVoice ? "已切换为随机美式 Neural 音色" : "已切换为默认音色 (EricNeural)");
      });

      const savedTheme = localStorage.getItem("hoshinoya_theme");
      if (savedTheme === "dark") {
        htmlEl.setAttribute("data-theme", "dark");
        themeBtn.textContent = "浅色";
      }

      themeBtn.addEventListener("click", () => {
        const isDark = htmlEl.getAttribute("data-theme") === "dark";
        if (isDark) {
          htmlEl.removeAttribute("data-theme");
          themeBtn.textContent = "深色";
          localStorage.setItem("hoshinoya_theme", "light");
        } else {
          htmlEl.setAttribute("data-theme", "dark");
          themeBtn.textContent = "浅色";
          localStorage.setItem("hoshinoya_theme", "dark");
        }
      });

      cnToggleBtn.addEventListener("click", () => {
        const hidden = document.body.classList.toggle("hide-cn");
        cnToggleBtn.classList.toggle("is-active", hidden);
        cnToggleBtn.textContent = hidden ? "显示中文" : "遮罩中文";
        if (!hidden) {
          document.querySelectorAll(".example-cn.revealed").forEach((el) => el.classList.remove("revealed"));
        }
      });

      const sizes = [16, 18, 20];
      let sizeIdx = 0;
      fontBtn.addEventListener("click", () => {
        sizeIdx = (sizeIdx + 1) % sizes.length;
        htmlEl.style.setProperty("--base-size", sizes[sizeIdx] + "px");
        fontBtn.textContent = sizeIdx === 0 ? "A+" : sizeIdx === 1 ? "A++" : "A";
        fontBtn.classList.toggle("is-active", sizeIdx > 0);
      });

      document.getElementById("magazineContent").addEventListener("click", (e) => {
        const speakBtn = e.target.closest("[data-speech]");
        if (speakBtn) {
          speakText(speakBtn.dataset.speech, speakBtn);
          return;
        }
        const cnEl = e.target.closest(".example-cn");
        if (cnEl && document.body.classList.contains("hide-cn")) {
          cnEl.classList.toggle("revealed");
        }
      });

      const pills = Array.from(document.querySelectorAll(".nav-pill"));
      const chapters = Array.from(document.querySelectorAll(".chapter"));
      const observer = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              pills.forEach((p) => p.classList.toggle("active", p.dataset.target === entry.target.id));
            }
          });
        },
        { rootMargin: "-25% 0px -65% 0px" }
      );
      chapters.forEach((c) => observer.observe(c));
    }

    renderMagazine();
    setupControls();
    setTimeout(() => TTSCache.pruneExpired(), 1500);
    if ("speechSynthesis" in window) {
      window.speechSynthesis.getVoices();
    }
  </script>
</body>
